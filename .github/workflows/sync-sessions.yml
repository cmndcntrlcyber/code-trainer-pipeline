name: Validate CoT Session Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # weekly Monday 6am — just a health check

permissions:
  contents: read

jobs:
  check-r2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Report R2 session inventory
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 -c '
          import json, urllib.request, sys, os

          account_id = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          token = os.environ["CLOUDFLARE_API_TOKEN"]
          bucket = "cot-sessions"
          base_url = f"https://api.cloudflare.com/client/v4/accounts/{account_id}/r2/buckets/{bucket}/objects"

          # Paginated listing
          all_objects = []
          cursor = ""
          page = 0
          while True:
              page += 1
              url = f"{base_url}?per_page=1000"
              if cursor:
                  url += f"&cursor={cursor}"
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
              with urllib.request.urlopen(req) as resp:
                  data = json.load(resp)
              all_objects.extend(data.get("result", []))
              cursor = (data.get("result_info") or {}).get("cursor", "")
              if not cursor:
                  break

          # Group by host/project prefix
          groups = {}
          for obj in all_objects:
              parts = obj["key"].split("/")
              prefix = "/".join(parts[:2]) if len(parts) >= 2 else parts[0]
              if prefix not in groups:
                  groups[prefix] = {"sessions": 0, "total": 0, "size": 0}
              groups[prefix]["total"] += 1
              groups[prefix]["size"] += obj.get("size", 0)
              if obj["key"].endswith(".jsonl") and "/subagents/" not in obj["key"]:
                  groups[prefix]["sessions"] += 1

          total_sessions = sum(g["sessions"] for g in groups.values())
          total_objects = sum(g["total"] for g in groups.values())
          total_size = sum(g["size"] for g in groups.values())

          lines = []
          lines.append("## CoT Session Inventory\n")
          lines.append(f"Listed {total_objects} objects across {page} page(s)\n")
          lines.append("| Host/Project | Sessions | Objects | Size |")
          lines.append("|---|---|---|---|")
          for prefix in sorted(groups):
              g = groups[prefix]
              lines.append(f"| {prefix} | {g[\"sessions\"]} | {g[\"total\"]} | {g[\"size\"]/(1024*1024):.1f} MB |")
          lines.append(f"\n**Total: {total_sessions} sessions, {total_objects} objects, {total_size/(1024*1024):.1f} MB**")

          output = "\n".join(lines)
          print(output)

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY", "")
          if summary_path:
              with open(summary_path, "a") as f:
                  f.write(output + "\n")
          '
