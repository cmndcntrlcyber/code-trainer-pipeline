# ═══════════════════════════════════════════════════════════════════
# EXPLORE — google/gemma-4-4b-it on RTX 3060 (6 GB)
# Budget: $10.88 (3.4h)
# Phase chain: DAPT → SFT → validation → GRPO → DPO →
#              validation → GGUF
# ═══════════════════════════════════════════════════════════════════
explore:
  role: "explore"
  base_model: "google/gemma-4-4b-it"

  dapt:
    base_model: "google/gemma-4-4b-it"
    corpus_dirs:
      - data/offensive-security/repositories
    max_seq_length: 2048
    lora_r: 32
    lora_alpha: 64
    lora_dropout: 0.05
    learning_rate: 2.5e-5
    num_epochs: 1
    min_lines: 10
    max_lines: 1000
    max_documents: 5000
    output_adapter: ${HF_USERNAME}/gemma4-4b-dapt-classify
    cloud:
      hardware: "a100-large"
      wandb_project: "rtpi-swarm-v4a-max-explore-dapt"
      timeout_seconds: 5400
      poll_interval: 60
      image: "huggingface/transformers-pytorch-gpu:latest"
      repo_url: "https://github.com/cmndcntrlcyber/code-trainer-pipeline.git"
      repo_ref: "main"

  sft:
    dapt_adapter: ${HF_USERNAME}/gemma4-4b-dapt-classify
    dataset_id: ${HF_USERNAME}/code-trainer-v11-explore
    dataset_revision: "main"
    train_limit: 8000
    num_epochs: 2
    max_seq_length: 4096
    lora_r: 32
    lora_alpha: 64
    lora_dropout: 0.05
    learning_rate: 5e-5
    batch_size: 1
    gradient_accumulation: 16
    output_adapter: ${HF_USERNAME}/gemma4-4b-explore-sft

  validation:
    classification_accuracy: 0.80
    zero_write_tool_violations: true

  rl:
    grpo:
      base_adapter: ${HF_USERNAME}/gemma4-4b-explore-sft
      dapt_adapter: ${HF_USERNAME}/gemma4-4b-dapt-classify
      base_model: "google/gemma-4-4b-it"
      prompt_dataset: ${HF_USERNAME}/code-trainer-v11-grpo-explore
      num_generations: 4
      learning_rate: 2.5e-7
      kl_coef: 0.1
      max_new_tokens: 512
      max_prompts: 200
      output_adapter: ${HF_USERNAME}/gemma4-4b-explore-grpo
      role: "explore"

    dpo:
      base_adapter: ${HF_USERNAME}/gemma4-4b-explore-grpo
      base_model: "google/gemma-4-4b-it"
      preference_dataset: ${HF_USERNAME}/code-trainer-v11-dpo-explore
      beta: 0.1
      learning_rate: 5e-7
      max_length: 4096
      max_pairs: 300
      output_adapter: ${HF_USERNAME}/gemma4-4b-explore-dpo

    rl_validation:
      classification_accuracy: 0.85
      zero_write_tool_violations: true

  deployment:
    quantization: "Q8_0"
    context_length: 4096
    port: 8086
    gguf_repo: ${HF_USERNAME}/gemma4-4b-explore-gguf
    source_adapter: ${HF_USERNAME}/gemma4-4b-explore-dpo
    adapter_chain:
      - ${HF_USERNAME}/gemma4-4b-dapt-classify
      - ${HF_USERNAME}/gemma4-4b-explore-sft
    base_model: "google/gemma-4-4b-it"

  cloud:
    hardware: "a100-large"
    wandb_project: "rtpi-swarm-v4a-max-explore"
    timeout_seconds: 16200
    poll_interval: 60
    image: "huggingface/transformers-pytorch-gpu:latest"
    repo_url: "https://github.com/cmndcntrlcyber/code-trainer-pipeline.git"
    repo_ref: "main"
    quants:
      - "Q8_0"

# ═══════════════════════════════════════════════════════════════════
# TRIAGE — Qwen3.5-0.8B on RK3588 NPU
# Budget: $4.64 (1.45h)
# Phase chain: SFT → validation → GRPO → validation → RKLLM
# ═══════════════════════════════════════════════════════════════════
triage:
  role: "triage"
  base_model: "Qwen/Qwen3.5-0.8B"

  sft:
    dataset_id: ${HF_USERNAME}/code-trainer-v11-triage
    dataset_revision: "main"
    train_limit: 5000
    num_epochs: 3
    max_seq_length: 512
    lora_r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    learning_rate: 2e-4
    batch_size: 4
    gradient_accumulation: 4
    output_adapter: ${HF_USERNAME}/qwen35-08b-triage-sft

  validation:
    routing_accuracy: 0.85

  rl:
    grpo:
      base_adapter: ${HF_USERNAME}/qwen35-08b-triage-sft
      base_model: "Qwen/Qwen3.5-0.8B"
      prompt_dataset: ${HF_USERNAME}/code-trainer-v11-grpo-triage
      num_generations: 4
      learning_rate: 1e-6
      kl_coef: 0.1
      max_new_tokens: 64
      max_prompts: 200
      output_adapter: ${HF_USERNAME}/qwen35-08b-triage-grpo
      role: "triage"

    rl_validation:
      routing_accuracy: 0.90

  deployment:
    format: "rkllm"
    target: "w8a8"
    target_platform: "rk3588"
    port: 8088
    rkllm_repo: ${HF_USERNAME}/qwen35-08b-triage-rkllm

  cloud:
    hardware: "a100-large"
    wandb_project: "rtpi-swarm-v4a-max-triage"
    timeout_seconds: 7200
    poll_interval: 60
    image: "huggingface/transformers-pytorch-gpu:latest"
    repo_url: "https://github.com/cmndcntrlcyber/code-trainer-pipeline.git"
    repo_ref: "main"

# ─── CONTINGENCY PLAN ───────────────────────────────────────────
#
# $20.00 (6.25h) reserved for retries and fallback. Priority order:
#
#   1. QWEN3-14B FALLBACK: If orchestrator SFT validation fails,
#      switch to Qwen/Qwen2.5-Coder-14B-Instruct with existing
#      DAPT adapter (${HF_USERNAME}/qwen14b-dapt-offsec).
#      Retrain SFT + RL using baseline pipeline-swarm-v4a.yml.
#      Cost: ~$29 (fits in contingency if explore/triage passed).
#
#   2. Orchestrator SFT retry: --train-limit 10000 (saves ~3h)
#   3. Worker FARCA retry: max_prompts=200 (saves ~0.75h)
#   4. Skip explore RL — SFT-only with system prompt may suffice
#   5. Skip triage GRPO — SFT alone at 3 epochs is likely sufficient
#
# RKLLM FALLBACK: If rkllm-toolkit doesn't support Qwen3.5-0.8B:
#   - Use llama.cpp ARM build with Q8_0 GGUF on CPU
#   - Slower but universally compatible
