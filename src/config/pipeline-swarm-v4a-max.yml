# ╔══════════════════════════════════════════════════════════════════╗
# ║  NEXUS SWARM v4a MAX — Maximum Quality Multi-Model Pipeline    ║
# ║  Layout A (without P40): 4 models, 5 nodes, ~$110 budget      ║
# ║                                                                 ║
# ║  Based on: pipeline-swarm-v4a.yml (baseline)                   ║
# ║  Upgrades: Qwen3-14B orchestrator, DAPT for all models,       ║
# ║            2-epoch SFT, full FARCA-GRPO + DPO all roles,       ║
# ║            NousResearch abliteration on orchestrator            ║
# ║                                                                 ║
# ║  Allocated:    $90.56 (~28.5h) across 4 role tracks            ║
# ║  Contingency:  $20.00 ( 6.25h) retry / Qwen2.5 fallback       ║
# ║  Total:        $110.20                                          ║
# ╚══════════════════════════════════════════════════════════════════╝
#
# USAGE:
#   cd /mnt/ssd/training && set -a && source .env && set +a
#   python -m src.scripts.launch_swarm_pipeline \
#       --config src/config/pipeline-swarm-v4a-max.yml --role all --wait

# ─── Swarm Fleet Topology (informational) ───────────────────────
swarm_meta:
  layout: "v4a-max"
  description: "5-node swarm, max quality. Qwen3-14B orchestrator on K1."
  nodes:
    - hostname: nexus-k1
      ip: 192.168.8.238
      gpu: "RTX 5060 Ti (16 GB)"
      host: "ACEMAGIC K1 (Ryzen 7 7730U, 32 GB DDR4)"
      role: orchestrator
      port: 8080
    - hostname: nexus-control
      ip: 192.168.8.248
      gpu: "RTX 3070 Laptop (8 GB)"
      host: "daedelu5"
      role: control_plane+worker
      ports: [4000, 8084, 9100, 50051, 50052]
    - hostname: nexus-3060
      ip: 192.168.8.161
      gpu: "RTX 3060 Laptop (6 GB)"
      role: explore
      port: 8086
    - hostname: nexus-opi5p
      ip: 192.168.8.224
      gpu: "RK3588 NPU (6 TOPS)"
      role: triage
      port: 8088
    - hostname: nexus-opi5b
      ip: 192.168.8.221
      gpu: "RK3588S CPU (ARM)"
      role: embeddings
      port: 8087

# ─── Shared Data Paths ──────────────────────────────────────────
data_collection:
  github_token: ${GITHUB_TOKEN}
  repos_dir: ./data/sample-data/repositories
  captures_dir: ./data/sample-data/captures
  catalog_db: ./data/catalog.db

preprocessing:
  dataset_name: cmndcntrlcyber/code-trainer-offsec-dataset

# ═══════════════════════════════════════════════════════════════════
# ORCHESTRATOR — Qwen3-14B on K1's RTX 5060 Ti (16 GB)
# Budget: $52.80 (16.5h)
# Phase chain: DAPT → SFT → validation → FARCA-GRPO → DPO →
#              validation → GGUF → abliteration
#
# MODEL: Qwen/Qwen3-14B (dense, 14B params)
#   - Improved reasoning over Qwen2.5 line
#   - Native thinking mode aligns with TTCA Assess→Select→Act
#   - Same VRAM footprint as Qwen2.5-Coder-14B (~8.5 GB at Q4_K_M)
#   - Requires fresh DAPT (Qwen2.5 adapter does not transfer)
#
# FALLBACK: If Qwen3-14B fails the SFT validation gate, retrain
#   with Qwen/Qwen2.5-Coder-14B-Instruct using the existing DAPT
#   adapter (${HF_USERNAME}/qwen14b-dapt-offsec). Covered by the
#   $20 contingency budget.
# ═══════════════════════════════════════════════════════════════════
orchestrator:
  role: "orchestrator"
  base_model: "Qwen/Qwen3-14B"

  dapt:
    base_model: "Qwen/Qwen3-14B"
    corpus_dirs:
      - data/offensive-security/repositories
    max_seq_length: 2048
    lora_r: 32
    lora_alpha: 64
    lora_dropout: 0.05
    learning_rate: 5e-5
    num_epochs: 1
    min_lines: 10
    max_lines: 1000
    max_documents: 10000
    output_adapter: ${HF_USERNAME}/qwen3-14b-dapt-offsec
    cloud:
      hardware: "a100-large"
      wandb_project: "rtpi-swarm-v4a-max-orchestrator-dapt"
      timeout_seconds: 10800
      poll_interval: 60
      image: "huggingface/transformers-pytorch-gpu:latest"
      repo_url: "https://github.com/cmndcntrlcyber/code-trainer-pipeline.git"
      repo_ref: "main"

  sft:
    dapt_adapter: ${HF_USERNAME}/qwen3-14b-dapt-offsec
    dataset_id: ${HF_USERNAME}/code-trainer-v11-orchestrator
    dataset_revision: "main"
    train_limit: 15000
    num_epochs: 2
    max_seq_length: 4096
    lora_r: 32
    lora_alpha: 64
    lora_dropout: 0.05
    learning_rate: 1e-4
    batch_size: 1
    gradient_accumulation: 16
    output_adapter: ${HF_USERNAME}/qwen3-14b-orchestrator-sft

  validation:
    tool_call_pass_rate: 0.75
    tool_call_scenarios: 14
    gsm8k_threshold: 0.55
    agent_progress_threshold: 3
    agent_scenarios: 7

  rl:
    farca_grpo:
      base_adapter: ${HF_USERNAME}/qwen3-14b-orchestrator-sft
      dapt_adapter: ${HF_USERNAME}/qwen3-14b-dapt-offsec
      base_model: "Qwen/Qwen3-14B"
      prompt_dataset: ${HF_USERNAME}/code-trainer-v11-grpo-orchestrator
      num_generations: 4
      learning_rate: 5e-7
      kl_coef: 0.1
      max_new_tokens: 768
      max_prompts: 500
      output_adapter: ${HF_USERNAME}/qwen3-14b-orchestrator-farca
      role: "orchestrator"
      claim_extraction_backend: "rule_based"
      nli_model_id: "vectara/hallucination_evaluation_model"
      sentence_encoder_id: "all-MiniLM-L6-v2"
      k_rel: 1
      mu: 0.16
      tau: 0.20
      nli_weight: 0.4
      rule_weight: 0.6
      warmup_steps: 0
      coherence_enabled: true
      coherence_weight: 0.3

    dpo:
      base_adapter: ${HF_USERNAME}/qwen3-14b-orchestrator-farca
      base_model: "Qwen/Qwen3-14B"
      preference_dataset: ${HF_USERNAME}/code-trainer-v11-dpo-orchestrator
      beta: 0.1
      learning_rate: 1e-6
      max_length: 4096
      max_pairs: 1500
      output_adapter: ${HF_USERNAME}/qwen3-14b-orchestrator-dpo
      include_persona_pairs: true
      persona_pairs_path: data/identity_examples/nexus_identity.jsonl

    rl_validation:
      tool_call_pass_rate: 0.80
      tool_call_scenarios: 14
      agent_progress_threshold: 5
      agent_scenarios: 7

  deployment:
    quantization: "Q4_K_M"
    context_length: 12288
    port: 8080
    gguf_repo: ${HF_USERNAME}/qwen3-14b-orchestrator-gguf
    source_adapter: ${HF_USERNAME}/qwen3-14b-orchestrator-dpo
    adapter_chain:
      - ${HF_USERNAME}/qwen3-14b-dapt-offsec
      - ${HF_USERNAME}/qwen3-14b-orchestrator-sft
    base_model: "Qwen/Qwen3-14B"

  abliteration:
    base_model: "Qwen/Qwen3-14B"
    source_adapter: ${HF_USERNAME}/qwen3-14b-orchestrator-dpo
    adapter_chain:
      - ${HF_USERNAME}/qwen3-14b-dapt-offsec
      - ${HF_USERNAME}/qwen3-14b-orchestrator-sft
    output_base: ${HF_USERNAME}/qwen3-14b-orchestrator
    abliterated_gguf_repo: ${HF_USERNAME}/qwen3-14b-orchestrator-abliterated-gguf
    techniques:
      - name: nousresearch
        method: biprojected
        n_samples: 512
        quantization: null
    evaluation:
      harmful_dataset: "Undi95/orthogonal-activation-steering-TOXIC"
      harmless_dataset: "tatsu-lab/alpaca"
      n_eval_samples: 200
      benchmark_tasks:
        - gsm8k
        - mmlu
      num_fewshot: 0
      batch_size: 16
    cloud:
      hardware: "a100-large"
      timeout_seconds: 9000
      wait_timeout_seconds: 14400
      poll_interval: 60
      image: "huggingface/transformers-pytorch-gpu:latest"
      repo_url: "https://github.com/cmndcntrlcyber/code-trainer-pipeline.git"
      repo_ref: "main"
      quants:
        - "Q4_K_M"

  cloud:
    hardware: "a100-large"
    wandb_project: "rtpi-swarm-v4a-max-orchestrator"
    timeout_seconds: 43200
    poll_interval: 60
    image: "huggingface/transformers-pytorch-gpu:latest"
    repo_url: "https://github.com/cmndcntrlcyber/code-trainer-pipeline.git"
    repo_ref: "main"
    quants:
      - "Q4_K_M"

# ═══════════════════════════════════════════════════════════════════
# WORKER — Qwen3-8B on daedelu5's RTX 3070 (8 GB)
# Budget: $22.88 (7.15h)
# Phase chain: DAPT → SFT → validation → FARCA-GRPO → DPO →
#              validation → GGUF
# ═══════════════════════════════════════════════════════════════════
