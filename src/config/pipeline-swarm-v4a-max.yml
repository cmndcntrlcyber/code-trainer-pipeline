      prompt_dataset: ${HF_USERNAME}/code-trainer-v11-grpo-worker
      num_generations: 4
      learning_rate: 5e-7
      kl_coef: 0.1
      max_new_tokens: 768
      max_prompts: 400
      output_adapter: ${HF_USERNAME}/qwen3-8b-worker-farca
      role: "worker"
      claim_extraction_backend: "rule_based"
      nli_model_id: "vectara/hallucination_evaluation_model"
      sentence_encoder_id: "all-MiniLM-L6-v2"
      k_rel: 1
      mu: 0.16
      tau: 0.20
      nli_weight: 0.4
