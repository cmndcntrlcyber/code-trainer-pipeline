# Code-Trainer Configuration
# Hardware: RTX 5060 Ti 16GB (Single GPU)

# Phase 1: Data Collection
data_collection:
  github_token: ${GITHUB_TOKEN}
  repos_dir: ./data/sample-data/repositories
  captures_dir: ./data/sample-data/captures
  catalog_db: ./data/catalog.db
  repos_per_language: 500
  min_quality_score: 30
  languages:
    - Python
    - JavaScript
    - TypeScript
    - Java
    - Go
    - Rust
    - C++
    - C#
  capture_workers: 8
  viewport_width: 2560
  viewport_height: 1440
  font_size: 14
  theme: "Default Dark+"

# Phase 1c: GitHub Stars Repo Ingestion
repo_ingestion:
  clone_dir: /tmp/repo_clones
  captures_dir: ./data/captures
  knowledge_dir: /mnt/ssd/knowledge
  workers: 4
  depth: 1
  max_file_size_kb: 500

# Phase 1b: PDF Knowledge Ingestion
pdf_ingestion:
  captures_dir: ./data/pdf_captures
  knowledge_dir: /mnt/ssd/knowledge
  domains:
    - AI
    - C
    - Code
    - Go
    - Java
    - Python
    - Q#
    - Red Team Knowledge
    - Rust
    - Rust Knowledge
    - Specialized PDFs
    - Sysadmin
    - Theory
    - Web
    - x-platform
  dpi: 300
  output_width: 2560
  workers: 4

# Phase 2: Preprocessing
preprocessing:
  dataset_name: cmndcntrlcyber/code-trainer-offsec-dataset
  max_code_length: 8192
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  private: true
  # Multimodal build: max pixel dimension for base64 WebP images on the `v2-multimodal` branch.
  # 1024 keeps dataset ~2 GB for 32k samples while preserving text readability for larger
  # future vision encoders (Swin-L, SigLIP). Swin-B input is 224 so the feature extractor
  # downscales anyway — this value is about Hub storage vs. future flexibility.
  image_max_dim: 1024
  multimodal_revision: "v2-multimodal"

# V7 Mixed Dataset — corrective action for distributional collapse
v7_mixed:
  dataset_name: cmndcntrlcyber/code-trainer-v7-mixed
  slice_a:
    source: cmndcntrlcyber/code-trainer-offsec-dataset
    subsample: 8000
  slice_b:
    source: NousResearch/hermes-function-calling-v1
    configs:
      - func_calling
      - func_calling_singleturn
      - glaive_func_calling
      - json_mode_agentic
      - json_mode_singleturn
  slice_c:
    source: greghavens/fable-5-coding-and-debugging-traces
  val_split: 0.1
  seed: 42
  private: false

# V8 Mixed Dataset — fixes multilingual hallucination + tool-call format mismatch
v8_mixed:
  dataset_name: cmndcntrlcyber/code-trainer-v8-mixed
  slice_a:
    source: cmndcntrlcyber/code-trainer-offsec-dataset
    subsample: 8000
  slice_b:
    source: glaiveai/glaive-function-calling-v2
    max_rows: 12000
  slice_c:
    source: greghavens/fable-5-coding-and-debugging-traces
    max_rows: 10000
  slice_d:
    source: teknium/OpenHermes-2.5
    max_rows: 8000
  val_split: 0.1
  seed: 42
  private: false

# V9 Mixed Dataset — fixes tool_call tag emission, adds curriculum training
v9_mixed:
  dataset_name: cmndcntrlcyber/code-trainer-v9-mixed
  slice_a:
    source: cmndcntrlcyber/code-trainer-offsec-dataset
    subsample: 8000
  slice_b:
    source: glaiveai/glaive-function-calling-v2
    max_rows: 19000
  slice_b_multi:
    synthetic_count: 2000
  slice_c:
    source: greghavens/fable-5-coding-and-debugging-traces
    max_rows: 10000
  slice_d:
    source: teknium/OpenHermes-2.5
    max_rows: 8000
  val_split: 0.1
  seed: 42
  private: false

# Phase 3: Vision Model (HF Skills A100 — cloud)
vision_model:
  # Device profile switches between local 5060 Ti (INT4 + 8bit optim) and A100 (full BF16).
  # Valid values: "a100" | "5060ti"
  device_profile: "a100"

  vision_encoder: "microsoft/swin-base-patch4-window7-224"
  decoder: "Qwen/Qwen2.5-Coder-1.5B-Instruct"

  # Cloud dataset (multimodal revision with base64 WebP images)
  dataset_id: "cmndcntrlcyber/code-trainer-offsec-dataset"
  dataset_revision: "v2-multimodal"

  # A100 profile
  batch_size: 8
  gradient_accumulation: 4
  learning_rate: 2e-4
  num_epochs: 3
  max_seq_length: 2048
  compute_dtype: "bfloat16"
  gradient_checkpointing: true
  use_8bit_optimizer: false      # A100 has VRAM for fused AdamW
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  output_dir: ./models/vision_model

  # HF Jobs cloud-job settings (HfApi.run_job — NOT AutoTrain)
  cloud:
    hardware: "a100-large"
    wandb_project: "rtpi-phase3-vision"
    adapter_repo: ${HF_USERNAME}/code-trainer-vision-adapter
    timeout_seconds: 36000       # 10h ceiling
    poll_interval: 60
    # Docker image used for the job. The huggingface/transformers-pytorch-gpu
    # image ships CUDA + torch + transformers. `uv sync --frozen` inside the
    # job reconciles the rest of pyproject.toml.
    image: "huggingface/transformers-pytorch-gpu:latest"
    # Public repo cloned at job start. No GH token needed while public.
    repo_url: "https://github.com/cmndcntrlcyber/code-trainer-pipeline.git"
    repo_ref: "main"

# Phase 4: Qwen Fine-tuning (HF Skills Cloud — HF Jobs, mirrors Phase 3 pattern)
qwen_finetuning:
  model: "Qwen/Qwen2.5-Coder-14B-Instruct"
  hardware: "a100-large"

  # Text-only dataset (the main branch — no images needed for decoder fine-tuning)
  dataset_id: "cmndcntrlcyber/code-trainer-offsec-dataset"
  dataset_revision: "main"

  # Common training knobs (overridden per sweep config below)
  num_epochs_sweep: 1
  max_seq_length: 2048

  validation_sweep:
    - name: conservative
      lora_r: 16
      lora_alpha: 32
      learning_rate: 1.5e-4
      batch_size: 1
      gradient_accumulation: 16
    - name: standard
      lora_r: 32
      lora_alpha: 64
      learning_rate: 2e-4
      batch_size: 2
      gradient_accumulation: 8
    - name: aggressive
      lora_r: 64
      lora_alpha: 128
      learning_rate: 3e-4
      batch_size: 4
      gradient_accumulation: 4
    - name: v7_mixed
      lora_r: 32
      lora_alpha: 64
      lora_dropout: 0.05
      learning_rate: 1.5e-4
      batch_size: 2
      gradient_accumulation: 8
      max_seq_length: 8192
      dataset_id: "cmndcntrlcyber/code-trainer-v7-mixed"
      dataset_revision: "main"
  full_training:
    num_epochs: 3
    top_n_configs: 2
  output_base: ${HF_USERNAME}/qwen14b-code-trainer

  # V7 validation thresholds (corrective action targets)
  v7_validation:
    eval_loss_threshold: 0.50
    tool_call_pass_rate: 0.80
    tool_call_scenarios: 10
    agent_progress_threshold: 3
    agent_scenarios: 5
    gsm8k_threshold: 0.60

  # HF Jobs cloud-job settings — same shape as vision_model.cloud
  cloud:
    hardware: "a100-large"
    wandb_project: "rtpi-phase4-qwen14b"
    adapter_base: ${HF_USERNAME}/qwen14b-code-trainer
    timeout_seconds: 50400        # 14h ceiling — V8 (4096 seq, 38K rows) needs ~12h
    poll_interval: 60
    image: "huggingface/transformers-pytorch-gpu:latest"
    repo_url: "https://github.com/cmndcntrlcyber/code-trainer-pipeline.git"
    repo_ref: "main"
    # Catastrophic-forgetting check (Ready Tensor capstone requirement). Run
    # via launch_benchmark.py with --adapter <repo> [--baseline]. GSM8K is the
    # default — math reasoning is orthogonal to screenshot-to-code, so it
    # cleanly detects forgetting on a 14B coder model.
    benchmark:
      task: "gsm8k"
      num_fewshot: 0
      batch_size: 16
      timeout_seconds: 2400          # 40m HF runtime cap
      wait_timeout_seconds: 7200     # 2h local poll budget

# Phase 5: Deployment — GGUF conversion runs on HF Jobs (a100-large for the
# 144 GB RAM, not the GPU). Local llama.cpp serving is configured in
# src/phase6_inference/. The local converter scripts under gguf/ are kept
# for offline conversion when needed.
deployment:
  quantization: "Q5_K_M"
  context_length: 8192
  port: 8080
  gguf_repo: ${HF_USERNAME}/qwen14b-code-trainer-gguf

  # Source adapter for Phase 5 conversion. V8 mixed dataset with native Qwen2.5
  # tool-call format (eval_loss 0.4837, fixes multilingual hallucination).
  source_adapter: ${HF_USERNAME}/qwen14b-code-trainer-v8_mixed
  base_model: "Qwen/Qwen2.5-Coder-14B-Instruct"

  # HF Jobs cloud-job settings — same shape as vision_model.cloud
  cloud:
    hardware: "a100-large"
    timeout_seconds: 7200          # HF runtime cap once job is RUNNING
    wait_timeout_seconds: 21600    # Local launcher --wait budget (queue + run, 6h)
    poll_interval: 60
    image: "huggingface/transformers-pytorch-gpu:latest"
    repo_url: "https://github.com/cmndcntrlcyber/code-trainer-pipeline.git"
    repo_ref: "main"
    # Quantization levels to produce + upload. Q5_K_M is the V9 default for
    # improved tool_call tag fidelity. Q4_K_M kept as fallback.
    quants:
      - "Q5_K_M"
      - "Q4_K_M"

# Phase 5b: Abliteration Benchmarking
# Runs the merged LoRA+base model through 3 abliteration techniques and
# benchmarks all 3 products against an un-abliterated control.
abliteration:
  base_model: "Qwen/Qwen2.5-Coder-14B-Instruct"
  source_adapter: ${HF_USERNAME}/qwen14b-code-trainer-aggressive
  output_base: ${HF_USERNAME}/qwen14b-code-trainer

  techniques:
    - name: obliteratus
      preset: advanced           # 4-dir SVD + norm-preserve + bias projection
      n_directions: 4
      norm_preserve: true
    - name: nousresearch
      method: biprojected        # norm-preserving biprojected ablation
      n_samples: 512
      quantization: null         # full precision for abliteration
    - name: abliterix
      steering_method: SRA       # Surgical Refusal Ablation
      optuna_trials: 50

  evaluation:
    harmful_dataset: "Undi95/orthogonal-activation-steering-TOXIC"
    harmless_dataset: "tatsu-lab/alpaca"
    n_eval_samples: 200
    benchmark_tasks:
      - gsm8k
      - mmlu
      - truthfulqa_mc2
    num_fewshot: 0
    batch_size: 16

  cloud:
    hardware: "a100-large"
    timeout_seconds: 21600       # 6h — three techniques + benchmarks
    wait_timeout_seconds: 28800  # 8h local poll budget
    poll_interval: 60
    image: "huggingface/transformers-pytorch-gpu:latest"
    repo_url: "https://github.com/cmndcntrlcyber/code-trainer-pipeline.git"
    repo_ref: "main"
    quants:
      - "Q4_K_M"

# Phase 5b-Baseline: Pre-fine-tuning abliteration baselines
# Runs abliteration against raw base models (no adapter merge) for both Qwen
# and Gemma. Produces comparison data against post-fine-tuning abliteration.
# Both runs execute sequentially in a single HF Job.
abliteration_baselines:
  runs:
    - name: qwen-base
      base_model: "Qwen/Qwen2.5-Coder-14B-Instruct"
      source_adapter: null
      output_base: ${HF_USERNAME}/qwen14b-base-abliterated
    - name: gemma-base
      base_model: "google/gemma-4-12B-it"
      source_adapter: null
      output_base: ${HF_USERNAME}/gemma4-12b-base-abliterated
  techniques:
    - name: obliteratus
      preset: advanced
      n_directions: 4
      norm_preserve: true
    - name: nousresearch
      method: biprojected
      n_samples: 512
      quantization: null
    - name: abliterix
      steering_method: SRA
      optuna_trials: 50
  evaluation:
    harmful_dataset: "Undi95/orthogonal-activation-steering-TOXIC"
    harmless_dataset: "tatsu-lab/alpaca"
    n_eval_samples: 200
    benchmark_tasks:
      - gsm8k
      - mmlu
      - truthfulqa_mc2
    num_fewshot: 0
    batch_size: 16
  cloud:
    hardware: "a100-large"
    timeout_seconds: 43200       # 12h — two models × three techniques + benchmarks
    wait_timeout_seconds: 50400  # 14h local poll budget
    poll_interval: 60
    image: "huggingface/transformers-pytorch-gpu:latest"
    repo_url: "https://github.com/cmndcntrlcyber/code-trainer-pipeline.git"
    repo_ref: "main"
    quants:
      - "Q4_K_M"

# Phase 5b-Gemma: Post-fine-tuning abliteration for Gemma
gemma_abliteration:
  base_model: "google/gemma-4-12B-it"
  source_adapter: ${HF_USERNAME}/gemma4-12b-code-trainer-aggressive
  output_base: ${HF_USERNAME}/gemma4-12b-code-trainer
  techniques:
    - name: obliteratus
      preset: advanced
      n_directions: 4
      norm_preserve: true
    - name: nousresearch
      method: biprojected
      n_samples: 512
      quantization: null
    - name: abliterix
      steering_method: SRA
      optuna_trials: 50
  evaluation:
    harmful_dataset: "Undi95/orthogonal-activation-steering-TOXIC"
    harmless_dataset: "tatsu-lab/alpaca"
    n_eval_samples: 200
    benchmark_tasks:
      - gsm8k
      - mmlu
      - truthfulqa_mc2
    num_fewshot: 0
    batch_size: 16
  cloud:
    hardware: "a100-large"
    timeout_seconds: 21600
    wait_timeout_seconds: 28800
    poll_interval: 60
    image: "huggingface/transformers-pytorch-gpu:latest"
    repo_url: "https://github.com/cmndcntrlcyber/code-trainer-pipeline.git"
    repo_ref: "main"
    quants:
      - "Q4_K_M"

# Phase 3b: Domain-Adaptive Continued Pretraining (DAPT)
# Causal LM next-token prediction on raw offsec code + PDF knowledge corpus.
# Runs BEFORE SFT to inject domain vocabulary and security patterns.
dapt:
  base_model: "Qwen/Qwen2.5-Coder-14B-Instruct"
  corpus_dirs:
    - data/offensive-security/repositories
    - data/pdf_captures
  max_seq_length: 4096
  lora_r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  learning_rate: 5e-5
  num_epochs: 1
  min_lines: 10
  max_lines: 1000
  output_adapter: ${HF_USERNAME}/qwen14b-dapt-offsec
  cloud:
    hardware: "a100-large"
    wandb_project: "rtpi-phase3b-dapt"
    timeout_seconds: 36000
    poll_interval: 60
    image: "huggingface/transformers-pytorch-gpu:latest"
    repo_url: "https://github.com/cmndcntrlcyber/code-trainer-pipeline.git"
    repo_ref: "main"

# Phase 4c: Chain-of-Thought RL (post-SFT refinement)
# Stage 1: GRPO on tool-use trajectories with rule-based reward
# Stage 2: DPO on reasoning quality with HTB/THM positive examples
rl_training:
  grpo:
    base_adapter: ${HF_USERNAME}/qwen14b-code-trainer-v9_mixed
    base_model: "Qwen/Qwen2.5-Coder-14B-Instruct"
    prompt_dataset: ${HF_USERNAME}/code-trainer-v10-grpo-prompts
    num_generations: 4
    learning_rate: 5e-7
    kl_coef: 0.1
    max_new_tokens: 1024
    output_adapter: ${HF_USERNAME}/qwen14b-code-trainer-v10-grpo
  dpo:
    base_adapter: ${HF_USERNAME}/qwen14b-code-trainer-v10-grpo
    base_model: "Qwen/Qwen2.5-Coder-14B-Instruct"
    preference_dataset: ${HF_USERNAME}/code-trainer-v10-dpo-pairs
    beta: 0.1
    learning_rate: 1e-6
    max_length: 4096
    output_adapter: ${HF_USERNAME}/qwen14b-code-trainer-v10-dpo
  v10_validation:
    eval_loss_threshold: 0.50
    tool_call_pass_rate: 0.85
    tool_call_scenarios: 14
    agent_progress_threshold: 5
    agent_scenarios: 7
    gsm8k_threshold: 0.60
  cloud:
    hardware: "a100-large"
    wandb_project: "rtpi-phase4c-rl"
    timeout_seconds: 36000
    poll_interval: 60
    image: "huggingface/transformers-pytorch-gpu:latest"
    repo_url: "https://github.com/cmndcntrlcyber/code-trainer-pipeline.git"
    repo_ref: "main"

# Phase 4e: RLAIF Reward Modeling
# AI preference labeling + Bradley-Terry scalar reward model
rlaif:
  policy_model: "Qwen/Qwen2.5-Coder-14B-Instruct"
  policy_adapter: ${HF_USERNAME}/qwen14b-code-trainer-v10-dpo
  reward_model_base: "Qwen/Qwen2.5-Coder-1.5B-Instruct"
  reward_model_output: ${HF_USERNAME}/code-trainer-reward-model
  preference_dataset: ${HF_USERNAME}/code-trainer-rlaif-preferences
  n_preference_pairs: 8000
  cloud:
    hardware: "a100-large"
    wandb_project: "rtpi-phase4e-rlaif"
    timeout_seconds: 14400
    poll_interval: 60
    image: "huggingface/transformers-pytorch-gpu:latest"
    repo_url: "https://github.com/cmndcntrlcyber/code-trainer-pipeline.git"
    repo_ref: "main"

# Phase 4f: RL Fine-Tuning (PPO with learned reward)
ppo_training:
  policy_adapter: ${HF_USERNAME}/qwen14b-code-trainer-v10-dpo
  base_model: "Qwen/Qwen2.5-Coder-14B-Instruct"
  reward_model: ${HF_USERNAME}/code-trainer-reward-model
  learning_rate: 1e-6
  kl_target: 0.05
  clip_range: 0.2
  batch_size: 4
  ppo_epochs: 2
  output_adapter: ${HF_USERNAME}/qwen14b-code-trainer-v10-ppo
  cloud:
    hardware: "a100-large"
    wandb_project: "rtpi-phase4f-ppo"
    timeout_seconds: 36000
    poll_interval: 60
    image: "huggingface/transformers-pytorch-gpu:latest"
    repo_url: "https://github.com/cmndcntrlcyber/code-trainer-pipeline.git"
    repo_ref: "main"

# Phase 4-Gemma: Gemma-4-12B Fine-tuning (parallel to qwen_finetuning)
# 12B dense model with native vision, Q4_K_M GGUF ~7.5 GB fits RTX 5060 Ti 16GB.
gemma_finetuning:
  model: "google/gemma-4-12B-it"
  hardware: "a100-large"

  dataset_id: "cmndcntrlcyber/code-trainer-offsec-dataset"
  dataset_revision: "main"

  num_epochs_sweep: 1
  max_seq_length: 4096

  validation_sweep:
    - name: standard
      lora_r: 32
      lora_alpha: 64
      learning_rate: 1e-4
      batch_size: 2
      gradient_accumulation: 8
    - name: aggressive
      lora_r: 64
      lora_alpha: 128
      learning_rate: 2e-4
      batch_size: 4
      gradient_accumulation: 4
  full_training:
    num_epochs: 3
    top_n_configs: 2
  output_base: ${HF_USERNAME}/gemma4-12b-code-trainer

  cloud:
    hardware: "a100-large"
    wandb_project: "rtpi-phase4-gemma4-12b"
    adapter_base: ${HF_USERNAME}/gemma4-12b-code-trainer
    timeout_seconds: 14400
    poll_interval: 60
    image: "huggingface/transformers-pytorch-gpu:latest"
    repo_url: "https://github.com/cmndcntrlcyber/code-trainer-pipeline.git"
    repo_ref: "main"
    benchmark:
      task: "gsm8k"
      num_fewshot: 0
      batch_size: 16
      timeout_seconds: 2400
      wait_timeout_seconds: 7200

# Phase 5-Gemma: Deployment — Gemma GGUF conversion
gemma_deployment:
  quantization: "Q4_K_M"
  context_length: 4096
  port: 8080
  gguf_repo: ${HF_USERNAME}/gemma4-12b-code-trainer-gguf

  # Source adapter — set after Phase 4A-Gemma sweep completes
  source_adapter: ${HF_USERNAME}/gemma4-12b-code-trainer-aggressive
  base_model: "google/gemma-4-12B-it"

  cloud:
    hardware: "a100-large"
    timeout_seconds: 7200
    wait_timeout_seconds: 21600
    poll_interval: 60
    image: "huggingface/transformers-pytorch-gpu:latest"
    repo_url: "https://github.com/cmndcntrlcyber/code-trainer-pipeline.git"
    repo_ref: "main"
    quants:
      - "Q4_K_M"
